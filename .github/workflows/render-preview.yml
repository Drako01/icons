name: Render real icon atlas PNG (feature-branch bootstrap)
on:
  push:
    branches: [feat/icons-0.1.1-readme-preview-auto-publish]
permissions:
  contents: write
jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render actual shipped SVG glyphs as Marketplace-safe PNG
        run: |
          python -m pip install --disable-pip-version-check cairosvg==2.7.1
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url="gallery/overview.svg",write_to="gallery/overview.png")
          PY
      - name: Commit generated icon preview only when changed
        shell: bash
        run: |
          set -euo pipefail
          git add gallery/overview.png
          if git diff --cached --quiet; then
            echo "Image unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(icons): render original icon atlas as PNG"
          git push origin HEAD:feat/icons-0.1.1-readme-preview-auto-publish
